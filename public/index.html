<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Check your Indian Railways reservation status.">
<title>PNR enquiry</title>
<style>
  :root { color-scheme: light; --paper: #f5f0e3; --ink: #142c27; --muted: #485b54; --line: #b6b9aa; --gold: #fac75e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 1rem/1.55 "Avenir Next", "Trebuchet MS", sans-serif; }
  main { width: min(100% - 2rem, 38rem); margin: clamp(2rem, 11vh, 8rem) auto 3rem; }
  header { background: var(--ink); color: var(--paper); padding: clamp(1.4rem, 5vw, 2.5rem); border-bottom: .35rem solid var(--gold); }
  .kicker { color: var(--gold); font: 700 .75rem/1.5 ui-monospace, monospace; letter-spacing: .18em; text-transform: uppercase; }
  h1 { margin: .25em 0 .1em; font: 400 clamp(2.8rem, 8vw, 4.7rem)/1 Georgia, serif; letter-spacing: -.055em; }
  header p { margin: .75rem 0 0; }
  .ticket { padding: clamp(1.15rem, 5vw, 2.5rem); border: 1px solid var(--line); border-top: 0; background: #fffaf0; }
  label { display: block; font-weight: 700; margin-bottom: .4rem; }
  .lookup { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .65rem; }
  input, button { font: inherit; border-radius: .2rem; min-height: 3rem; }
  input { width: 100%; border: 1px solid #6c786d; background: white; color: var(--ink); padding: .55rem .7rem; font-family: ui-monospace, monospace; }
  button { padding: .55rem 1rem; border: 1px solid var(--ink); background: var(--ink); color: white; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .65; cursor: wait; }
  :focus-visible { outline: 3px solid #a64d00; outline-offset: 3px; }
  p { margin: .65rem 0 0; }
  .note, footer { color: var(--muted); font-size: .9rem; }
  #status { margin: 0; }
  #status:not(:empty) { margin-top: 1rem; border-left: 3px solid #a64d00; padding-left: .75rem; }
  #result { margin-top: 1rem; }
  pre { padding: .75rem; background: #ebe9dc; white-space: pre-wrap; overflow-wrap: anywhere; }
  footer { margin-top: 1rem; display: flex; gap: .5rem 1rem; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  a, .text-button { color: #1d5544; text-decoration: underline; text-underline-offset: .16em; }
  .text-button { background: none; border: 0; padding: 0; min-height: 2rem; font-weight: 400; }
  @media (max-width: 360px) { .lookup { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="kicker">Indian Railways lookup</div>
    <h1>PNR enquiry</h1>
    <p>Check the reservation status on your ticket.</p>
  </header>
  <section class="ticket" aria-label="Reservation lookup">
    <form id="lookup">
      <label for="pnr">10-digit PNR number</label>
      <div class="lookup">
        <input id="pnr" type="text" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" autocomplete="off" required aria-describedby="hint">
        <button id="check">Check status</button>
      </div>
      <p class="note" id="hint">Your PNR is sent to Indian Railways for this lookup.</p>
    </form>
    <p id="status" role="status"></p>
    <section id="result" hidden aria-label="Railway response">
      <strong>Railway response</strong>
      <div id="summary"></div>
      <details><summary>Show response details</summary><pre id="response"></pre></details>
    </section>
  </section>
  <footer>
    <button class="text-button" id="probe" type="button">Test connection</button>
    <a href="https://www.indianrail.gov.in/enquiry/PNR/PnrEnquiry.html?locale=en" target="_blank" rel="noopener noreferrer">Open official enquiry ↗</a>
  </footer>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
